# Standard tacular-omics CI. Canonical copy: tacular-omics workspace templates/.
# Package-specific jobs (docs, wheel/extras install matrices, coverage) live
# below the standard jobs. The `test` matrix covers MCP on Windows (all extras).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check src tests benchmarks
      - run: uv run ruff format --check src tests benchmarks
      - run: uv run ty check src
      - run: python scripts/release_version.py check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests

  # Proves the declared lower bounds still work: installs the oldest allowed
  # version of every direct dependency.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --resolution lowest-direct --all-extras --all-groups
      - run: uv run pytest tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - run: python scripts/release_version.py check --dist dist
      - name: Import the built wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('${{ github.workspace }}/pyproject.toml','rb'))['project']['name'].replace('-','_'))")
          uv run --isolated --no-project --with "$(ls ${{ github.workspace }}/dist/*.whl)" python -c "import $pkg; print($pkg.__version__)"

  # Coverage reporting (kept from the package's pre-standard CI).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run pytest tests --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/paftacular
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: tacular-omics/paftacular
          report_type: test_results
          fail_ci_if_error: false

  # Documentation build and executable-example checks (kept from the
  # package's pre-standard CI; release artifacts are covered by `package`).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --all-groups
      - name: Build documentation
        run: uv run sphinx-build -W -b html docs docs/_build/html
      - name: llms.txt and llms-full.txt are served at the docs root
        run: test -s docs/_build/html/llms.txt && test -s docs/_build/html/llms-full.txt
      - name: Test documentation examples
        run: uv run sphinx-build -W -b doctest docs docs/_build/doctest

  # Installs the built wheel outside the checkout with each extra combination,
  # at both the declared minimum and the latest dependency versions, and runs
  # the public-API/installation suites against it.
  wheel-installations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [none, smiles, peptacular, mcp, "mcp,smiles", all]
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Build and install wheel outside the checkout
        shell: bash
        run: |
          uv build
          uv venv /tmp/paftacular-wheel
          wheels=(dist/*.whl)
          requirement="${wheels[0]}"
          if [[ "${{ matrix.extra }}" != "none" ]]
          then
            requirement+="[${{ matrix.extra }}]"
          fi
          options=()
          if [[ "${{ matrix.dependencies }}" == "minimum" ]]
          then
            options+=(--constraint ci/minimum-dependencies.txt)
          fi
          uv pip install --python /tmp/paftacular-wheel/bin/python "$requirement" pytest "${options[@]}"
      - name: Test installation and public APIs
        env:
          PAFTACULAR_TEST_WHEEL: "1"
          PAFTACULAR_EXPECT_EXTRAS: ${{ matrix.extra }}
        run: |
          cd /tmp
          /tmp/paftacular-wheel/bin/python -I -m pytest "$GITHUB_WORKSPACE/tests/test_installation.py" "$GITHUB_WORKSPACE/tests/test_interchange.py" "$GITHUB_WORKSPACE/tests/test_regressions.py" "$GITHUB_WORKSPACE/tests/test_resolution.py"
      - name: Test MCP tools and stdio connection
        if: contains(matrix.extra, 'mcp') || matrix.extra == 'all'
        run: |
          cd /tmp
          /tmp/paftacular-wheel/bin/python -I -m pytest "$GITHUB_WORKSPACE/tests/test_mcp.py"
      - name: Run the full suite with all extras
        if: matrix.extra == 'all'
        run: |
          cd /tmp
          /tmp/paftacular-wheel/bin/python -I -m pytest "$GITHUB_WORKSPACE/tests"

  # Same hooks contributors run at commit time (.pre-commit-config.yaml).
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx pre-commit run --all-files --show-diff-on-failure
