version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    # ci/minimum-dependencies.txt pins the declared pyproject floors for the
    # "minimum" CI jobs. Dependabot must not bump it, or those jobs stop
    # testing the floors users can actually install.
    exclude-paths:
      - "ci/**"
    # Sibling major versions are raised by the tacular-omics overseer under the
    # sibling pin policy (floor plus major cap). Dependabot reads peptacular's
    # current version from the pyproject floor (3.1.2), not uv.lock (already 4.x),
    # so its major-update attempt leaves the lockfile unchanged and fails the job
    # with "Expected lockfile to change!".
    ignore:
      - dependency-name: "peptacular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tacular"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
