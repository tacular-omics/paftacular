[project]
name = "paftacular"
dynamic = ["version"]
description = "Parse, serialize, and analyze HUPO-PSI mzPAF peak annotations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["tacular>=1.1.0"]
keywords = ["mass-spectrometry", "mzpaf", "peak-annotation", "proteomics", "psi"]
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tacular-omics/paftacular"
Documentation = "https://paftacular.readthedocs.io/"
Repository = "https://github.com/tacular-omics/paftacular"
Issues = "https://github.com/tacular-omics/paftacular/issues"
Changelog = "https://github.com/tacular-omics/paftacular/blob/main/HISTORY.md"
DOI = "https://doi.org/10.5281/zenodo.19076277"

[project.optional-dependencies]
smiles = ["pysmiles>=2.0.1"]
peptacular = ["peptacular>=3.1.2"]
all = ["pysmiles>=2.0.1", "peptacular>=3.1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paftacular"]

[dependency-groups]
dev = [
    "pysmiles>=2.0.1",
    "peptacular>=3.1.2",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "ty>=0.0.11",
    "pytest-cov>=6.0.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.25",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E741",  # Abigous variable names)
]

[tool.hatch.version]
path = "src/paftacular/__init__.py"
